name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Data — schema, coordinates, typography
        run: node scripts/check-data.mjs
      - name: Design system — spacing, strokes, tokens, one home per component
        run: node scripts/audit-design.mjs
