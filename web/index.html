<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Museo — New York City Museums</title>

    <link rel="preload" as="font" type="font/woff2" href="fonts/whitney-light.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/whitney-book.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/whitney-ssm-book.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/whitney-cond-semibold.woff2" crossorigin />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="system.css" />
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="app.css" />
  </head>

  <body>
    <header class="masthead">
      <div class="masthead__brand">
        <h1 class="wordmark">Museo</h1>
        <p class="t-label">New York City · All Five Boroughs</p>
      </div>
      <p class="masthead__tally">
        <span class="tally-figure" id="count">—</span>
        <span class="t-label" id="count-label">Museums</span>
      </p>
    </header>

    <div class="search-bar">
      <label class="sr-only" for="search">Search museums</label>
      <input
        id="search"
        class="field"
        type="search"
        placeholder="Search a museum, a neighborhood, an address"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <nav class="filters">
      <div class="filter-set">
        <span class="t-label filter-set__name">Borough</span>
        <div class="filter-set__items" id="borough-filters" role="group" aria-label="Filter by borough"></div>
      </div>

      <div class="filter-set">
        <span class="t-label filter-set__name">Discipline</span>
        <div class="filter-set__items" id="category-filters" role="group" aria-label="Filter by discipline"></div>
      </div>

      <div class="filter-set filter-set--end">
        <button type="button" class="toggle" id="viewport-only" aria-pressed="false">
          On map only
        </button>
        <button type="button" class="toggle toggle--plain" id="reset">Reset</button>
      </div>
    </nav>

    <main class="layout">
      <section class="index" aria-label="Museum index">
        <div class="index__head" aria-hidden="true">
          <span class="t-label">Nº</span>
          <span class="t-label">Museum</span>
          <span class="t-label">Borough</span>
        </div>
        <ol class="index__list" id="list"></ol>
        <p class="index__empty t-label" id="empty" hidden>Nothing matches</p>
      </section>

      <section class="map-pane" aria-label="Map">
        <div id="map"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
