name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # nothing ships that the data or map checks would refuse
      - run: node scripts/check-data.mjs
      - run: node scripts/check-map.mjs
      - run: node scripts/check-css.mjs
      - run: node scripts/build-site.mjs
      - name: Refuse to publish font files
        run: |
          if find _site -iname '*.woff*' -o -iname '*.otf' -o -iname '*.ttf' | grep -q .; then
            echo "::error::a font file reached _site/ — this site is set in system type and ships none"
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
