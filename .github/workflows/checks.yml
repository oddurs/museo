name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Data — schema, coordinates, typography
        run: node scripts/check-data.mjs
      - name: Map — the drawn city still matches the data
        run: node scripts/check-map.mjs
      - name: CSS — no rule reaches further than it means to
        run: node scripts/check-css.mjs
