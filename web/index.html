<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museo — Museums of New York City</title>
<meta name="description" content="An index of the 107 museums of the five boroughs, on a drawn map of the city after dark.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c0e">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="museo.css">
</head>
<body>
<div id="stage">
  <canvas id="base" aria-hidden="true"></canvas>
  <svg id="map" role="img" aria-label="New York City, with a point at each museum">
    <g id="scene">
      <g id="pins"></g>
    </g>
  </svg>
</div>

<div class="scale" aria-hidden="true">
  <div class="scale-bar"><i id="scaleBar"></i><b id="scaleTxt">1 mile</b></div>
  <p class="scale-note" id="scaleNote">Zoom in for streets</p>
</div>

<aside id="panel" class="glass">
  <header class="masthead">
    <div>
      <h1 class="wordmark display">Museo</h1>
      <p class="sub">Museums of New York City</p>
    </div>
    <div class="tally">
      <span class="tally-n display tnum" id="count">107</span>
      <span class="micro tally-l" id="countLabel">Museums</span>
    </div>
  </header>

  <div class="controls">
    <label class="search" id="searchWrap">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="sr-only" hidden>Search museums</span>
      <input id="q" type="search" placeholder="Search museums, neighborhoods" autocomplete="off" spellcheck="false" aria-label="Search museums">
      <button type="button" id="clear" aria-label="Clear search">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="7" fill="currentColor" opacity=".28"/>
          <path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </label>

    <div class="segmented" id="segs" role="tablist" aria-label="Filter by borough">
      <span class="thumb" id="thumb"></span>
    </div>
  </div>

  <div id="list" role="list"></div>

  <div class="hint">
    <span><kbd>/</kbd> search</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> browse</span>
    <span><kbd>esc</kbd> clear</span>
  </div>
</aside>

<section id="card" class="glass" aria-live="polite">
  <div class="card-top">
    <h2 class="card-n display" id="cName"></h2>
    <button class="card-x" id="cClose" type="button" aria-label="Close">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" aria-hidden="true">
        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="card-tags" id="cTags"></div>
  <p class="card-a" id="cAddr"></p>
  <div class="card-do">
    <a class="btn btn-1" id="cSite" target="_blank" rel="noopener noreferrer">Visit site</a>
    <a class="btn btn-2" id="cMap" target="_blank" rel="noopener noreferrer">Directions</a>
  </div>
</section>

<div id="zoom" class="glass">
  <button type="button" id="zin" aria-label="Zoom in">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
  </button>
  <button type="button" id="zout" aria-label="Zoom out">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <path d="M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<p class="credit">
  Boroughs: NYC Planning · Coordinates:
  <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>
</p>
<script src="city.js"></script>
<script src="streets-data.js"></script>
<script src="cartography.js"></script>
<script src="app.js"></script>
</body>
</html>
